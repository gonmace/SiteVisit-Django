{% extends "manager/base.html" %}
{% block title %}Eliminar Sitio{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-base-100 rounded-2xl border border-base-300 shadow-xs p-8 text-center">

    <div class="w-12 h-12 rounded-2xl bg-error/10 flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </div>

    <h2 class="text-lg font-bold text-base-content mb-1">Eliminar sitio</h2>
    <p class="text-sm text-base-content/50 mb-1">
      <span class="font-mono font-bold text-base-content">{{ object.code }}</span> — {{ object.name }}
    </p>
    <p class="text-xs text-base-content/40 mb-6">Esta acción no se puede deshacer.</p>

    <form method="post" class="flex justify-center gap-3">
      {% csrf_token %}
      <a href="{% url 'manager:sites_list' %}" class="btn btn-ghost btn-sm h-9 min-h-0 border border-base-300 text-xs">
        Cancelar
      </a>
      <button type="submit" class="btn btn-delete btn-sm h-9 min-h-0 px-5 text-xs font-semibold">
        Eliminar
      </button>
    </form>

  </div>
</div>
{% endblock %}
